name: refresh-lab9-v1-baseline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-lab9-v1-baseline
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: "src/requirements*.txt"
      - name: Install dependencies
        run: uv pip install -r requirements.txt -r requirements-lab9.txt
      - name: Validate the committed evaluation set
        run: python -m lab9.evalset --check
      - name: Regenerate the main-branch baseline
        run: python -m lab9.eval --shape swarm --spec config/metric_spec.yaml --out reports/baseline_v1.json
      - name: Verify baseline provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from lab9.evalset import sha12

          report = json.loads(Path("reports/baseline_v1.json").read_text(encoding="utf-8"))
          expected = sha12(Path("data/eval/eval_set_v1.jsonl"))
          actual = report.get("manifest", {}).get("eval_set_sha")
          if actual != expected:
              raise SystemExit(f"baseline SHA {actual!r} does not match eval set {expected!r}")
          print(f"baseline verified: {actual}")
          PY
      - name: Commit refreshed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/baseline_v1.json
          if git diff --cached --quiet; then
            echo "Baseline is already up to date."
          else
            git commit -m "ci: refresh Lab 9 v1 baseline"
            git push origin HEAD:main
          fi
